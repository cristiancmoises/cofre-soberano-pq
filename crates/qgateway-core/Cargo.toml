[package]
name        = "qgateway-core"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
authors     = { workspace = true }
repository  = { workspace = true }
description = "QGateway core — PQ reverse-proxy substrate for Cofre Soberano PQ."
keywords    = ["pqc", "proxy", "gateway", "audit"]
categories  = ["network-programming"]

[dependencies]
qaudit-core      = { path = "../qaudit-core" }
qtransport-cspq  = { path = "../qtransport-cspq" }
tokio            = { workspace = true }
tokio-rustls     = { workspace = true }
rustls           = { workspace = true }
rustls-pemfile   = { workspace = true }
toml             = { workspace = true }
serde            = { workspace = true }
chrono           = { workspace = true }
anyhow           = { workspace = true }
thiserror        = { workspace = true }
hex              = { workspace = true }
tracing          = { workspace = true }
arc-swap         = { workspace = true }

[dev-dependencies]
tempfile         = "3"
tokio            = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "time", "sync", "test-util"] }
# Sprint 6.5: rcgen for generating self-signed certs in the SNI dispatch
# integration test. Dev-only; never compiled into release binaries.
rcgen            = "0.13"