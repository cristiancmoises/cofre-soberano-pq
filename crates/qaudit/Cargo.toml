[package]
name        = "qaudit"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
authors     = { workspace = true }
repository  = { workspace = true }
description = "qaudit CLI — initialize, append, verify and inspect post-quantum signed audit logs."
keywords    = ["pqc", "audit", "cli", "ml-dsa"]
categories  = ["command-line-utilities", "cryptography"]

[[bin]]
name = "qaudit"
path = "src/main.rs"

[dependencies]
qaudit-core = { path = "../qaudit-core" }
clap        = { workspace = true }
anyhow      = { workspace = true }
hex         = { workspace = true }
chrono      = { workspace = true }
serde       = { workspace = true }
serde_json  = "1"
ciborium    = { workspace = true }

[dev-dependencies]
tempfile    = "3"
